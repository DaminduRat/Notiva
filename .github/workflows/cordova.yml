name: Build Cordova APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        sudo npm install -g cordova
        npm install

    - name: Compile Web App
      run: npm run build

    - name: Initialize Cordova Shell
      run: |
        rm -rf cordova-app
        cordova create cordova-app com.damindur.notiva Notiva
        cd cordova-app
        cordova platform add android
        rm -rf www/*
        cp -r ../dist/* www/

    - name: Build Android APK
      run: |
        cd cordova-app
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: notiva-release-apk
        path: cordova-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
